services:
  backend:
    build: ./backend
    volumes:
      - ./checkpoints:/checkpoints:ro
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      # - DISABLE_ONNX=true
    networks:
      - localnet
    # ports:
    #   - 127.0.0.1:8000:8000  # Uncomment for local debug
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/package.json:/app/package.json
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - localnet
    restart: unless-stopped

  dataset-gateway:
    image: nginx:alpine
    entrypoint: ["sh", "/entrypoint.sh"]
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./dataset/entrypoint.gateway.sh:/entrypoint.sh:ro
      - ./dataset/gateway.conf:/etc/wireguard/gateway.conf:ro
      - ./dataset/nginx-gateway.conf:/etc/nginx/templates/default.conf:ro
      - ./dataset/activity/:/activity
    networks:
      - localnet
    restart: unless-stopped
    profiles:
      - production

  dataset-suspender:
    image: alpine:3.19
    command: ["sh", "/suspender.sh"]
    volumes:
      - ./dataset/suspender.sh:/suspender.sh:ro
      - ./dataset/notify.sh:/notify.sh:ro
      - ./dataset/activity:/activity
    secrets:
      - fly_token
    environment:
      - FLY_APP_NAME=dataset-spell-jan-czechowski-com
      - MOST_RECENT_CALL_CHECK_FREQUENCY_S=10
      - MOST_RECENT_CALL_MAX_AGE_S=300
      - MACHINES_STATE_MAX_AGE_S=900
      - MACHINE_STARTED_MAX_NOTIFY_S=1800
      - NTFY_TOPIC
      - NTFY_EMAIL
    networks:
      - localnet
    restart: unless-stopped
    profiles:
      - production

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    environment:
      DEV_MODE: "true"
      NGINX_ENVSUBST_FILTER: DEV_MODE
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    networks:
      - localnet
    depends_on:
      - backend
      - frontend
    ports:
      - 127.0.0.1:3080:80
    restart: unless-stopped

  # Production: self-contained nginx with built frontend
  site:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    networks:
      - localnet
      - nginx-proxy
    #ports: ["127.0.0.1:80:80"]  # Only for local testing - nginx-proxy handles routing in prod
    environment:
      VIRTUAL_HOST: spell.janczechowski.com
      LETSENCRYPT_HOST: spell.janczechowski.com
      DEV_MODE: "false"
      NGINX_ENVSUBST_FILTER: DEV_MODE
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    depends_on:
      - backend
      - dataset-gateway
    restart: always
    profiles:
      - production

secrets:
  fly_token:
    file: ./dataset/flyio_token_gateway.txt

networks:
  localnet:
  nginx-proxy:
    external: true
