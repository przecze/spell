# =============================================================================
# SPELL PROJECT DEPLOYMENT PLAYBOOK
# =============================================================================
#
# SAFETY GUARANTEES:
#
# 1. TARGET DIRECTORY: Only /srv/projects/spell is touched
#    - All file operations use project_dir variable
#    - The synchronize task has explicit dest: /srv/projects/spell/
#
# 2. NGINX-PROXY INTEGRATION:
#    - Connects to existing nginx-proxy network (external: true)
#    - Sets VIRTUAL_HOST=spell.janczechowski.com
#    - Sets LETSENCRYPT_HOST=spell.janczechowski.com
#    - Does NOT modify /srv/projects/nginx-proxy/ files
#    - docker-gen will auto-discover and route traffic
#
# 3. NO DNS CHANGES: You must manually add DNS A record:
#    spell.janczechowski.com -> your server IP
#
# 4. DOCKER COMMANDS: Only these docker operations are performed:
#    - docker compose down (stop existing containers)
#    - docker compose build (build images)
#    - docker compose up -d (start containers)
#    All scoped to /srv/projects/spell/docker-compose.yml
#
# 5. PRODUCTION SHAPE (two local containers + two Fly.io apps):
#    - gateway: nginx + WireGuard tunnel, serves frontend, proxies to Fly
#    - suspender-api: monitors idle and suspends api-spell-jan-czechowski-com
#    - suspender-dataset: monitors idle and suspends dataset-spell-jan-czechowski-com
#    - API (FastAPI + model) runs on Fly.io: api-spell-jan-czechowski-com
#    - Dataset (Streamlit) runs on Fly.io: dataset-spell-jan-czechowski-com
#
# 6. MANUAL SETUP REQUIRED before first deploy on a new server:
#    API Fly.io token + WireGuard:
#      1. scp api/flyio_token_gateway_api.txt server:/srv/projects/spell/api/
#      2. make api-wg-create  (from project root on the server)
#    Dataset Fly.io token + WireGuard:
#      3. scp dataset/flyio_token_gateway.txt server:/srv/projects/spell/dataset/
#      4. make dataset-wg-create  (from project root on the server)
#
# =============================================================================

- name: Deploy spell project
  hosts: bluh
  
  vars:
    # SAFETY: This is the ONLY directory we touch on the server
    project_dir: /srv/projects/spell

  tasks:
    # -------------------------------------------------------------------------
    # TASK 1: Create project directory
    # SAFETY: Only creates /srv/projects/spell, nothing else
    # -------------------------------------------------------------------------
    - name: Ensure project directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # TASK 2: Pre-flight check - ensure Fly.io tokens exist on server
    # SAFETY: Read-only check, fails early if manual setup not done
    # -------------------------------------------------------------------------
    - name: Check dataset Fly.io token file exists
      ansible.builtin.stat:
        path: "{{ project_dir }}/dataset/flyio_token_gateway.txt"
      register: fly_token_dataset_stat

    - name: Warn if dataset Fly.io token missing
      ansible.builtin.debug:
        msg: |
          WARNING: Fly.io token not found at {{ project_dir }}/dataset/flyio_token_gateway.txt
          suspender-dataset will NOT work until you:
          1. scp dataset/flyio_token_gateway.txt to the server
          2. Run: make dataset-wg-create (from {{ project_dir }})
      when: not fly_token_dataset_stat.stat.exists

    - name: Check API Fly.io token file exists
      ansible.builtin.stat:
        path: "{{ project_dir }}/api/flyio_token_gateway_api.txt"
      register: fly_token_api_stat

    - name: Warn if API Fly.io token missing
      ansible.builtin.debug:
        msg: |
          WARNING: Fly.io token not found at {{ project_dir }}/api/flyio_token_gateway_api.txt
          suspender-api will NOT work until you:
          1. scp api/flyio_token_gateway_api.txt to the server
          2. Run: make api-wg-create (from {{ project_dir }})
      when: not fly_token_api_stat.stat.exists

    # -------------------------------------------------------------------------
    # TASK 3: Sync project files from local to server
    # SAFETY:
    #   - src uses playbook_dir to get absolute path to project root
    #   - dest: is explicitly /srv/projects/spell/
    #   - delete: no means we DON'T delete files on server that aren't local
    #   - rsync_opts ensure we don't follow symlinks outside the project
    # -------------------------------------------------------------------------
    - name: Sync project files to server
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ project_dir }}/"
        delete: no
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=spell_env"
          - "--exclude=node_modules"
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=ansible"
          - "--exclude=.DS_Store"
          - "--exclude=hf_cache"
          # Fly.io secrets + WireGuard configs (manually managed on server)
          - "--exclude=dataset/flyio_token_gateway.txt"
          - "--exclude=dataset/gateway.conf"
          - "--exclude=dataset/activity"
          - "--exclude=api/flyio_token_gateway_api.txt"
          - "--exclude=api/gateway.conf"
          # Include checkpoints (the model files) — first sync is slow (~500MB)
          - "--exclude=api_to_flyio_plan.md"

    # -------------------------------------------------------------------------
    # TASK 4: Ensure Fly.io gateway activity directory exists
    # SAFETY: Only creates directory for gateway/suspender communication
    # -------------------------------------------------------------------------
    - name: Ensure Fly.io activity directory exists
      ansible.builtin.file:
        path: "{{ project_dir }}/dataset/activity"
        state: directory
        mode: '0755'

    # -------------------------------------------------------------------------
    # TASK 5: Stop existing containers (if any)
    # SAFETY: Only affects containers defined in /srv/projects/spell/docker-compose.yml
    # -------------------------------------------------------------------------
    - name: Stop existing containers
      ansible.builtin.shell: |
        cd {{ project_dir }} && docker compose --profile production down --remove-orphans
      ignore_errors: yes  # OK if nothing is running yet

    # -------------------------------------------------------------------------
    # TASK 6: Build and start containers
    # SAFETY: Only builds/starts containers in /srv/projects/spell/
    # The docker-compose.yml binds to 127.0.0.1 only, not exposed publicly
    # -------------------------------------------------------------------------
    - name: Build and start containers
      ansible.builtin.shell: |
        cd {{ project_dir }} && docker compose --profile production up -d --build gateway suspender-api suspender-dataset
      register: docker_result

    - name: Show docker compose output
      ansible.builtin.debug:
        var: docker_result.stdout_lines

    # -------------------------------------------------------------------------
    # TASK 7: Verify containers are running
    # SAFETY: Read-only check, just shows status
    # -------------------------------------------------------------------------
    - name: Check container status
      ansible.builtin.shell: |
        cd {{ project_dir }} && docker compose ps
      register: ps_result

    - name: Show running containers
      ansible.builtin.debug:
        var: ps_result.stdout_lines

