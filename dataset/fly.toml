app = 'dataset-spell-jan-czechowski-com'
primary_region = 'fra'

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[build]
  dockerfile = 'Dockerfile'

[[vm]]
  memory = '1024mb'
  cpus = 1
